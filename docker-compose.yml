version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  inventory:
    build: ./inventory
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  inventory-consumer:
    build: ./inventory
    command: python consumer.py
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  payment:
    build: ./payment
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
      - INVENTORY_URL=http://inventory:8000
    depends_on:
      - redis
      - inventory

  payment-consumer:
    build: ./payment
    command: python consumer.py
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  notification:
    build: ./notification
    command: python consumer.py
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis